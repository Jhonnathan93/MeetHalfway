# Internal nginx server for the frontend container. It serves the static Vue
# SPA on port 80 and falls back to index.html so client-side routes resolve.
# The edge nginx (see ../nginx/nginx.conf) handles /api/v1 proxying and CORS;
# this server only serves the built assets.
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Long-cache hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths return the app shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
