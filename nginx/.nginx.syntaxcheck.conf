user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # --- Explicit CORS allow-list (Requirement 11.3) ---
    # Only the origins listed here are permitted. Any other Origin resolves to
    # the empty string, so no Access-Control-Allow-Origin header is emitted and
    # the browser blocks the cross-origin request. Add/adjust origins per
    # environment; do NOT use a wildcard "*".
    map $http_origin $cors_allow_origin {
        default                          "";
        "http://localhost:5173"          "http://localhost:5173";
        "http://localhost:8080"          "http://localhost:8080";
        "http://localhost"               "http://localhost";
    }

    upstream backend {
        server 127.0.0.1:8080;
    }

    upstream frontend {
        server 127.0.0.1:8081;
    }

    server {
        listen       80;
        server_name  _;

        # --- Versioned API surface (Requirement 11.1) ---
        # Reverse-proxy everything under /api/v1 to the Spring Boot backend.
        location /api/v1/ {
            # Reflect only allow-listed origins (empty => header omitted).
            add_header 'Access-Control-Allow-Origin'  $cors_allow_origin always;
            add_header 'Vary' 'Origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin' always;
            add_header 'Access-Control-Max-Age' '3600' always;

            # Preflight: short-circuit only for permitted origins.
            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # --- Frontend SPA (everything else) ---
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
